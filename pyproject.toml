[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artools"
version = "0.1.0"
description = "Trajectory generation tools for the Auxiliary Telescope at the SRT site"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ARTools contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
artools = "artools.cli:main"
artools-gui = "artools.web_launcher:main"

[project.optional-dependencies]
astronomy = [
    "astropy>=7.2,<9",
    "astroquery>=0.4.10,<0.5",
]
satellite = [
    "astropy>=7.2,<9",
    "numpy>=2,<3",
    "pycraf>=2.1,<3",
]
web = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.48,<1",
    "python-multipart>=0.0.29,<1",
]
dev = [
    "pytest>=8,<10",
    "numpy>=2,<3",
    # Starlette's TestClient dependency changed during the 0.x -> 1.x
    # transition.  Keep both clients in the development environment so the
    # supported FastAPI range remains testable across that transition.
    "httpx>=0.28,<1",
    "httpx2>=2.12,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
artools = ["web_assets/*.css", "web_assets/*.js"]
